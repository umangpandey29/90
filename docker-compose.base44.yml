services:
  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm
    environment:
      - PORT=5173
      - BASE_PATH=/
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command: sh -c "npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @workspace/class9-blueprint run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  pnpm-store:
