services:
  web:
    image: oven/bun:1
    working_dir: /app
    # Dependencies are installed into the node_modules volume after the bind
    # mount is in place, using the committed bun.lock, then the Vite dev server
    # (source is bind-mounted, so edits hot reload) is exec'd.
    command:
      - sh
      - -ec
      - bun install --frozen-lockfile && exec bun run dev
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_PATH=/
      - BASE44_PREVIEW_MODE
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
    labels:
      - base44.project=Final Comeback
      - base44.kind=web
      - base44.port=3000

volumes:
  web_node_modules:
