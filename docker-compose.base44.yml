services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_PATH=/
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - BASE44_PREVIEW_MODE
    volumes:
      - .:/app
      - class9_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        npm install --no-package-lock --no-audit --no-fund
        exec npm run dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    restart: on-failure
    labels:
      base44.project: "Final Comeback"
      base44.kind: web
      base44.port: "3000"

volumes:
  class9_node_modules:
